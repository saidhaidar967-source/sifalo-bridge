<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Raadeeye Nets · Admin</title>
<style>
  :root{
    --bg:#fff; --bg-soft:#F3F6FE; --ink:#14213D; --ink-soft:#4A5568; --muted:#8A94A6;
    --line:#E3E8F2; --grid:#DDE3EF; --blue:#2451D6; --blue-dark:#1B3FAA; --green:#1E9E4A; --red:#D93025; --amber:#B7791F;
    --zebra:#F8FAFE; --hover:#EAF0FF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  .hidden{ display:none !important; }

  /* login */
  .login{ max-width:380px; margin:12vh auto 0; padding:0 18px; }
  .login h1{ font-family:Georgia,serif; font-size:1.4rem; margin:0 0 6px; }
  .login p{ color:var(--ink-soft); margin:0 0 18px; }
  input,select,textarea{ font-family:inherit; font-size:0.9rem; color:var(--ink); }
  .login input{ width:100%; padding:12px; border:1.5px solid var(--line); border-radius:8px; font-size:1rem; }
  .err{ color:var(--red); font-size:0.85rem; margin:10px 0 0; min-height:1.2em; }

  .btn{ border:none; border-radius:8px; padding:8px 13px; font-weight:700; font-size:0.82rem; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-ghost{ background:#fff; border:1.5px solid var(--blue); color:var(--blue); }
  .btn-ok{ background:var(--green); color:#fff; }
  .btn-soft{ background:var(--bg-soft); border:1.5px solid var(--line); color:var(--blue); }
  .btn:disabled{ opacity:0.55; cursor:wait; }

  /* top bar */
  header{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap; }
  header b.logo{ font-family:Georgia,serif; font-size:1.1rem; }
  .nav{ display:flex; gap:4px; }
  .nav button{ background:none; border:none; padding:8px 14px; font-weight:700; font-size:0.86rem; color:var(--ink-soft); cursor:pointer; border-radius:8px; }
  .nav button.on{ background:var(--blue); color:#fff; }
  .spacer{ flex:1; }
  .upd{ font-size:0.75rem; color:var(--muted); }

  .page{ padding:14px 16px 50px; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat{ background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .stat b{ display:block; font-size:1.25rem; color:var(--blue); }
  .stat span{ font-size:0.74rem; color:var(--ink-soft); }

  /* toolbar */
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .bar input[type=search], .bar input[type=date], .bar select{ padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:#fff; }
  .bar input[type=search]{ min-width:220px; flex:1; max-width:340px; }
  .bar label{ font-size:0.74rem; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .presets{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chipbtn{ background:var(--bg-soft); border:1.5px solid var(--line); border-radius:999px; padding:6px 13px; font-weight:700; font-size:0.8rem; color:var(--ink-soft); cursor:pointer; }
  .chipbtn.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .count{ font-size:0.8rem; color:var(--ink-soft); margin-left:auto; }

  /* spreadsheet grid */
  .gridwrap{ border:1px solid var(--grid); border-radius:8px; overflow:auto; max-height:calc(100vh - 290px); min-height:200px; }
  table{ border-collapse:separate; border-spacing:0; width:100%; font-size:0.82rem; }
  th,td{ border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); padding:6px 9px; text-align:left; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  th{ position:sticky; top:0; z-index:3; background:#EEF2FA; font-weight:700; color:var(--ink-soft); cursor:pointer; user-select:none; }
  th:hover{ background:#E2E9F7; }
  th .arr{ color:var(--blue); margin-left:4px; }
  th.num, td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  th.chk, td.chk{ width:34px; text-align:center; cursor:default; padding:6px 4px; }
  tbody tr:nth-child(even){ background:var(--zebra); }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--hover); }
  tbody tr.sel{ background:#DCE7FF; }
  tfoot td{ position:sticky; bottom:0; background:#EEF2FA; font-weight:700; z-index:2; border-top:2px solid var(--grid); }
  .tag{ font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--bg-soft); color:var(--ink-soft); }
  .tag.paid,.tag.delivered{ background:#E7F6EC; color:var(--green); }
  .tag.pending,.tag.todo{ background:#FFF4DB; color:var(--amber); }
  .tag.failed{ background:#FDE8E6; color:var(--red); }
  .empty{ text-align:center; color:var(--muted); padding:40px 0; }
  .pager{ display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; font-size:0.8rem; color:var(--ink-soft); }
  .bulk{ background:#FFF9E6; border:1px solid #F3DC9A; border-radius:8px; padding:8px 12px; margin-bottom:10px; display:flex; gap:10px; align-items:center; font-size:0.84rem; }

  /* side drawer */
  .shade{ position:fixed; inset:0; background:rgba(20,33,61,0.35); z-index:40; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); background:#fff; z-index:41; box-shadow:-6px 0 24px rgba(0,0,0,0.15); overflow:auto; padding:18px; }
  .drawer h2{ margin:0 0 4px; font-size:1.15rem; }
  .drawer .sub{ color:var(--muted); font-size:0.78rem; margin-bottom:10px; }
  .drawer .x{ position:absolute; top:12px; right:14px; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--ink-soft); }
  .kv{ display:grid; grid-template-columns:90px 1fr; gap:4px 10px; font-size:0.86rem; margin:12px 0; }
  .kv span{ color:var(--muted); }
  .kv a{ color:var(--blue); font-weight:600; text-decoration:none; }
  .box{ background:var(--bg-soft); border-radius:8px; padding:10px 12px; margin:10px 0; font-size:0.86rem; line-height:1.6; }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  textarea{ width:100%; min-height:80px; padding:9px; border:1.5px solid var(--line); border-radius:8px; resize:vertical; }
  .mini{ width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:6px; }
  .mini th,.mini td{ border:none; border-bottom:1px solid var(--line); padding:6px 4px; position:static; background:none; cursor:default; max-width:none; white-space:normal; }
  .mini tr{ cursor:default; }
  .mini tr.link{ cursor:pointer; }
  .mini tr.link:hover{ background:var(--hover); }

  /* content editors */
  .drawer.wide{ width:min(680px,100%); }
  .fld{ display:block; margin:0 0 12px; }
  .fld > span{ display:block; font-size:0.76rem; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .fld input[type=text], .fld input[type=number], .fld textarea{ width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; }
  .fld input:focus, .fld textarea:focus{ outline:none; border-color:var(--blue); }
  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .hint{ font-size:0.76rem; color:var(--muted); margin:-6px 0 12px; }
  .thumb{ width:38px; height:53px; object-fit:cover; border-radius:4px; border:1px solid var(--grid); display:block; background:var(--bg-soft); }
  .coverprev{ width:120px; height:168px; object-fit:cover; border-radius:6px; border:1px solid var(--grid); background:var(--bg-soft); display:block; margin-bottom:8px; }
  .sect{ border:1px solid var(--grid); border-radius:10px; padding:14px 16px; margin-bottom:14px; max-width:820px; }
  .sect h3{ margin:0 0 10px; font-size:0.98rem; }
  .li{ border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; background:var(--zebra); }
  .li .tools{ display:flex; gap:6px; justify-content:flex-end; margin-bottom:6px; }
  .li .tools button{ background:#fff; border:1px solid var(--line); border-radius:6px; cursor:pointer; padding:2px 8px; font-size:0.8rem; }
  .savebar{ position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 0; display:flex; gap:12px; align-items:center; max-width:820px; }
  .ok{ color:var(--green); font-weight:700; font-size:0.85rem; }
  .bad{ color:var(--red); font-weight:700; font-size:0.85rem; }

  /* reports */
  .reports{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .panel{ border:1px solid var(--grid); border-radius:10px; padding:12px 14px; }
  .panel h3{ margin:0 0 6px; font-size:0.95rem; }
  .bar-in{ height:6px; background:var(--blue); border-radius:3px; min-width:2px; }
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <h1>Raadeeye Nets</h1>
  <p>Admin login</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="btn btn-primary" style="width:100%;margin-top:6px;padding:12px;" id="loginBtn">Log in</button>
</div>

<div id="appView" class="hidden">
  <header>
    <b class="logo">Raadeeye Nets</b>
    <div class="nav" id="nav"></div>
    <span class="spacer"></span>
    <span class="upd" id="upd"></span>
    <button class="btn btn-soft" id="refreshBtn">↻ Refresh</button>
    <button class="btn btn-soft" id="logoutBtn">Log out</button>
  </header>
  <div class="page">
    <div class="stats" id="stats"></div>
    <div id="main"></div>
  </div>
</div>

<div id="shade" class="shade hidden"></div>
<div id="drawer" class="drawer hidden"></div>
<div id="editor" class="drawer wide hidden"></div>

<script>
  const $ = id => document.getElementById(id);
  const TZ = 'Africa/Mogadishu';
  let token = localStorage.getItem('rn_admin_token') || '';
  let orders = [];
  let deliveredShown = null;
  let timer = null;
  let view = 'orders';              // orders | customers | reports
  let openId = null;                // order id shown in the drawer
  let openCustomer = null;          // customer key shown in the drawer
  const sel = new Set();            // selected order ids

  const F = { q:'', pay:'all', del:'all', region:'all', book:'all', from:'', to:'', preset:'todo' };
  const SORT = { orders:{ k:'createdAt', dir:-1 }, customers:{ k:'last', dir:-1 } };
  const PAGE = { orders:0, customers:0 };
  const PAGE_SIZE = 100;
  let custQ = '';
  // (default view is applied after the helper functions are defined, see start())

  // all text goes through textContent, so customer input can never inject HTML
  function h(tag, attrs, ...kids){
    const el = document.createElement(tag);
    for(const k in (attrs || {})){
      if(k === 'class') el.className = attrs[k];
      else if(k === 'value') el.value = attrs[k];
      else if(k === 'checked') el.checked = !!attrs[k];
      else if(k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] != null && attrs[k] !== false) el.setAttribute(k, attrs[k]);
    }
    kids.flat().forEach(c => { if(c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }
  const money = n => '$' + Number(n || 0).toFixed(2);
  const dayOf = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone:TZ });           // YYYY-MM-DD in Mogadishu
  const when  = iso => new Date(iso).toLocaleString('en-GB', { timeZone:TZ, day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' });
  const whenDay = iso => new Date(iso).toLocaleDateString('en-GB', { timeZone:TZ, day:'numeric', month:'short', year:'numeric' });

  async function api(path, opts = {}){
    const res = await fetch(path, { ...opts, headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, ...(opts.headers || {}) } });
    if(res.status === 401){ logout(); throw new Error('Please log in again.'); }
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  /* ---------------- login ---------------- */
  function show(v){ $('loginView').classList.toggle('hidden', v !== 'login'); $('appView').classList.toggle('hidden', v !== 'app'); }
  function logout(){ token = ''; localStorage.removeItem('rn_admin_token'); clearInterval(timer); closeDrawer(); show('login'); }
  $('loginBtn').onclick = async () => {
    $('loginErr').textContent = ''; $('loginBtn').disabled = true;
    try{
      const res = await fetch('/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: $('pw').value }) });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || 'Login failed.');
      token = data.token; localStorage.setItem('rn_admin_token', token); $('pw').value = ''; start();
    } catch(e){ $('loginErr').textContent = e.message; }
    $('loginBtn').disabled = false;
  };
  $('pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').onclick = logout;
  $('refreshBtn').onclick = () => load(true);
  $('shade').onclick = closeDrawer;

  /* ---------------- helpers on orders ---------------- */
  const isPaid = o => o.payStatus === 'paid';
  const isToDeliver = o => isPaid(o) && o.deliveryStatus !== 'delivered';
  const itemsText = o => (o.items || []).map(i => i.qty + '× ' + i.title).join(', ');
  const payLabel = o => o.payStatus === 'paid' ? 'Paid' : o.payStatus === 'failed' ? 'Failed' : 'Pending';
  const delLabel = o => !isPaid(o) ? '—' : o.deliveryStatus === 'delivered' ? 'Delivered' : 'To deliver';
  const custKey = o => { const d = String(o.phone || '').replace(/\D/g, ''); return d ? d.slice(-9) : (o.email || o.id).toLowerCase(); };
  function waLink(phone){ let d = String(phone).replace(/\D/g, ''); if(d.length === 9) d = '252' + d; return 'https://wa.me/' + d; }

  function filtered(){
    const q = F.q.trim().toLowerCase();
    return orders.filter(o => {
      if(F.pay === 'paid' && !isPaid(o)) return false;
      if(F.pay === 'unpaid' && isPaid(o)) return false;
      if(F.pay === 'pending' && o.payStatus !== 'pending') return false;
      if(F.pay === 'failed' && o.payStatus !== 'failed') return false;
      if(F.del === 'todo' && !isToDeliver(o)) return false;
      if(F.del === 'delivered' && !(isPaid(o) && o.deliveryStatus === 'delivered')) return false;
      if(F.region !== 'all' && o.region !== F.region) return false;
      if(F.book !== 'all' && !(o.items || []).some(i => i.title === F.book)) return false;
      const d = dayOf(o.createdAt);
      if(F.from && d < F.from) return false;
      if(F.to && d > F.to) return false;
      if(q){
        const hay = [o.id, o.name, o.phone, o.email, o.region, o.city, itemsText(o), o.notes].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ---------------- order table columns ---------------- */
  const COLS = [
    { k:'createdAt',   label:'Date',       v:o => o.createdAt,           t:o => when(o.createdAt), sort:'date' },
    { k:'id',          label:'Order #',    v:o => o.id },
    { k:'name',        label:'Customer',   v:o => o.name },
    { k:'phone',       label:'Phone',      v:o => o.phone },
    { k:'email',       label:'Email',      v:o => o.email },
    { k:'region',      label:'Region',     v:o => o.region },
    { k:'city',        label:'City',       v:o => o.city },
    { k:'items',       label:'Items',      v:o => itemsText(o) },
    { k:'books',       label:'Books',      v:o => o.books,               num:true },
    { k:'booksTotal',  label:'Books $',    v:o => o.booksTotal,          t:o => money(o.booksTotal), num:true },
    { k:'deliveryFee', label:'Delivery $', v:o => o.deliveryFee,         t:o => money(o.deliveryFee), num:true },
    { k:'total',       label:'Total $',    v:o => o.total,               t:o => money(o.total), num:true },
    { k:'pay',         label:'Payment',    v:o => payLabel(o),           tag:o => ['tag ' + o.payStatus, payLabel(o)] },
    { k:'del',         label:'Delivery',   v:o => delLabel(o),           tag:o => isPaid(o) ? ['tag ' + (o.deliveryStatus === 'delivered' ? 'delivered' : 'todo'), delLabel(o)] : null },
    { k:'notes',       label:'Notes',      v:o => o.notes || '' }
  ];

  function sortRows(rows, s, cols){
    const c = cols.find(x => x.k === s.k) || cols[0];
    const val = o => c.sort === 'date' ? new Date(c.v(o)).getTime() : c.v(o);
    return rows.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if(typeof x === 'number' && typeof y === 'number') return (x - y) * s.dir;
      return String(x).localeCompare(String(y), undefined, { numeric:true, sensitivity:'base' }) * s.dir;
    });
  }

  /* ---------------- CSV ---------------- */
  function csvCell(v){
    let s = String(v == null ? '' : v);
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;                    // stop spreadsheet formula injection
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function downloadCsv(name, header, rows){
    const text = '﻿' + [header, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' })), download: name });
    document.body.append(a); a.click(); a.remove();
  }
  const todayStr = () => dayOf(new Date().toISOString());

  /* ---------------- orders view ---------------- */
  const PRESETS = [['todo','To deliver'], ['unpaid','Unpaid / unclear'], ['delivered','Delivered'], ['paid','All paid'], ['all','Everything']];
  function applyPreset(p){
    F.preset = p; F.pay = 'all'; F.del = 'all';
    if(p === 'todo'){ F.pay = 'paid'; F.del = 'todo'; }
    if(p === 'unpaid'){ F.pay = 'unpaid'; }
    if(p === 'delivered'){ F.pay = 'paid'; F.del = 'delivered'; }
    if(p === 'paid'){ F.pay = 'paid'; }
    PAGE.orders = 0;
  }
  function setRange(days){
    const to = new Date(); const from = new Date(Date.now() - (days - 1) * 86400000);
    F.to = dayOf(to.toISOString()); F.from = days ? dayOf(from.toISOString()) : '';
    if(!days){ F.from = ''; F.to = ''; }
    PAGE.orders = 0;
  }

  function sel2(label, key, options){
    return h('label', {}, label, h('select', { onchange: e => { F[key] = e.target.value; F.preset = ''; PAGE.orders = 0; renderMain(); } },
      options.map(([v, t]) => h('option', { value:v, selected: F[key] === v ? 'selected' : null }, t))));
  }

  function renderOrders(root){
    const regions = [...new Set(orders.map(o => o.region))].sort();
    const books = [...new Set(orders.flatMap(o => (o.items || []).map(i => i.title)))].sort();
    let rows = sortRows(filtered(), SORT.orders, COLS);
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    PAGE.orders = Math.min(PAGE.orders, pages - 1);
    const pageRows = rows.slice(PAGE.orders * PAGE_SIZE, (PAGE.orders + 1) * PAGE_SIZE);

    root.append(h('div', { class:'presets' }, PRESETS.map(([id, label]) =>
      h('button', { class:'chipbtn' + (F.preset === id ? ' on' : ''), onclick: () => { applyPreset(id); renderMain(); } }, label))));

    const search = h('input', { type:'search', placeholder:'Search name, phone, email, order #, city, book, notes…', value:F.q,
      oninput: e => { F.q = e.target.value; PAGE.orders = 0; clearTimeout(search._t); search._t = setTimeout(() => { renderMain(); const el = root.querySelector('input[type=search]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250); } });
    root.append(h('div', { class:'bar' },
      search,
      sel2('Payment', 'pay', [['all','All'],['paid','Paid'],['unpaid','Unpaid (all)'],['pending','Pending'],['failed','Failed']]),
      sel2('Delivery', 'del', [['all','All'],['todo','To deliver'],['delivered','Delivered']]),
      sel2('Region', 'region', [['all','All regions'], ...regions.map(r => [r, r])]),
      sel2('Book', 'book', [['all','All books'], ...books.map(b => [b, b])])
    ));
    root.append(h('div', { class:'bar' },
      h('label', {}, 'From', h('input', { type:'date', value:F.from, onchange: e => { F.from = e.target.value; F.preset = ''; PAGE.orders = 0; renderMain(); } })),
      h('label', {}, 'To', h('input', { type:'date', value:F.to, onchange: e => { F.to = e.target.value; F.preset = ''; PAGE.orders = 0; renderMain(); } })),
      h('button', { class:'chipbtn', onclick: () => { setRange(1); F.preset = ''; renderMain(); } }, 'Today'),
      h('button', { class:'chipbtn', onclick: () => { setRange(7); F.preset = ''; renderMain(); } }, 'Last 7 days'),
      h('button', { class:'chipbtn', onclick: () => { setRange(30); F.preset = ''; renderMain(); } }, 'Last 30 days'),
      h('button', { class:'chipbtn', onclick: () => { setRange(0); renderMain(); } }, 'Any date'),
      h('button', { class:'chipbtn', onclick: () => { Object.assign(F, { q:'', pay:'all', del:'all', region:'all', book:'all', from:'', to:'', preset:'all' }); renderMain(); } }, 'Clear all'),
      h('span', { class:'count' }, rows.length + ' order' + (rows.length === 1 ? '' : 's')),
      h('button', { class:'btn btn-ghost', onclick: () => downloadCsv('raadeeye-orders-' + todayStr() + '.csv',
          [...COLS.map(c => c.label), 'Created (Mogadishu)'],
          rows.map(o => [...COLS.map(c => c.v(o)), when(o.createdAt)])) }, '⬇ Export CSV (' + rows.length + ')')
    ));

    // bulk action bar
    const selRows = rows.filter(o => sel.has(o.id) && isToDeliver(o));
    if(sel.size){
      root.append(h('div', { class:'bulk' },
        h('b', {}, sel.size + ' selected'),
        selRows.length ? h('button', { class:'btn btn-ok', onclick: async e => {

  /* ---------------- customers ---------------- */
  function buildCustomers(){
    const map = new Map();
    for(const o of orders){
      const key = custKey(o);
      let c = map.get(key);
      if(!c){ c = { key, name:o.name, phone:o.phone, email:o.email, region:o.region, city:o.city, orders:[], paidOrders:0, books:0, spent:0, first:o.createdAt, last:o.createdAt }; map.set(key, c); }
      c.orders.push(o);
      if(new Date(o.createdAt) > new Date(c.last)){ c.last = o.createdAt; c.name = o.name; c.email = o.email; c.region = o.region; c.city = o.city; c.phone = o.phone; }
      if(new Date(o.createdAt) < new Date(c.first)) c.first = o.createdAt;
      if(isPaid(o)){ c.paidOrders++; c.books += o.books; c.spent += o.total; }
    }
    return [...map.values()];
  }

    { k:'name',   label:'Customer',    v:c => c.name },

    { k:'paidOrders', label:'Paid orders', v:c => c.paidOrders, num:true },

    { k:'spent',  label:'Total spent', v:c => c.spent, t:c => money(c.spent), num:true },

  function table(head, rows, widths){

  function renderReports(root){
    const paid = orders.filter(isPaid);
    const byBook = new Map(), byRegion = new Map(), byDay = new Map();
    for(const o of paid){
      for(const i of o.items || []){ const b = byBook.get(i.title) || { qty:0, rev:0 }; b.qty += i.qty; b.rev += i.qty * i.price; byBook.set(i.title, b); }
      const r = byRegion.get(o.region) || { orders:0, books:0, rev:0 }; r.orders++; r.books += o.books; r.rev += o.total; byRegion.set(o.region, r);
      const d = dayOf(o.createdAt); const x = byDay.get(d) || { orders:0, books:0, rev:0 }; x.orders++; x.books += o.books; x.rev += o.total; byDay.set(d, x);
    }
    const totalRev = paid.reduce((s, o) => s + o.total, 0);
    const days = [];
    for(let i = 0; i < 14; i++){ days.push(dayOf(new Date(Date.now() - i * 86400000).toISOString())); }

    root.append(h('p', { class:'upd', style:'margin:0 0 10px' }, 'Reports count paid orders only. Total paid: ' + money(totalRev) + ' from ' + paid.length + ' orders.'));

        table(['Day', 'Orders', 'Books', 'Revenue'], days.map(d => { const v = byDay.get(d) || { orders:0, books:0, rev:0 }; return [d, String(v.orders), String(v.books), money(v.rev)]; })),

  // shrink big photos in the browser before upload (max 1000px, JPEG)
  function fileToCover(file){
    return new Promise((resolve, reject) => {
      if(!/^image\//.test(file.type)) return reject(new Error('Choose an image file (JPG, PNG or WebP).'));
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => reject(new Error('Could not read that image.'));
      img.src = url;
    });
  }
  const fileToDataUrl = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read the file.')); r.readAsDataURL(file); });

      field('Title', 'title'),
      h('div', { class:'fgrid' }, field('Author (used for search)', 'author'), field('Price in US dollars (e.g. 9.50)', 'price', { type:'number', step:'0.01', min:'0' })),
      h('div', { class:'fgrid' }, field('Star rating shown on the store (between 4.0 and 5.0)', 'rating', { type:'number', step:'0.1', min:'4', max:'5' }), h('span', {})),
      h('div', { class:'fgrid' },
        h('label', { class:'fld' }, h('span', {}, 'Category'), h('select', { style:'width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px', onchange: e => { f.category = e.target.value; } }, cats.map(c => h('option', { value:c, selected: c === f.category ? 'selected' : null }, c)))),
        field('Line under the title (e.g. Buug • 128 bog)', 'meta')),
      h('label', { class:'fld' }, h('span', {}, 'More Info text'), h('textarea', { style:'min-height:220px', oninput: e => { f.info = e.target.value; } }, f.info)),
      h('div', { class:'hint' }, 'Leave a blank line between paragraphs.'),
      h('div', { class:'fld' }, h('span', {}, 'Cover image'), prev,
        h('input', { type:'file', accept:'image/*', onchange: async e => {
          const file = e.target.files[0]; if(!file) return;
          try{ f.cover = await fileToCover(file); prev.src = f.cover; prev.style.visibility = 'visible'; msg.textContent = ''; } catch(err){ msg.textContent = err.message; }
        } }), h('div', { class:'hint', style:'margin-top:6px' }, 'Tall covers look best (about 5:7). Big photos are shrunk automatically.')),
      h('div', { class:'fld' }, h('span', {}, 'Free sample PDF (optional)'), sampleNote,
        h('input', { type:'file', accept:'application/pdf', onchange: async e => {
          const file = e.target.files[0]; if(!file) return;
          if(file.size > 8 * 1024 * 1024){ msg.textContent = 'The PDF is over 8 MB. Make it smaller (for example the first 20 pages only).'; e.target.value = ''; return; }
          try{ f.sample = await fileToDataUrl(file); f.sampleName = file.name.replace(/\.pdf$/i, ''); f.removeSample = false; msg.textContent = ''; sampleNote.textContent = 'Will upload: ' + file.name; } catch(err){ msg.textContent = err.message; }
        } }),
        b && b.hasSample ? h('label', { style:'display:block;margin-top:6px;font-size:0.84rem' }, h('input', { type:'checkbox', onchange: e => { f.removeSample = e.target.checked; } }), ' Remove the current sample') : null),
      h('label', { style:'display:flex;gap:8px;align-items:center;margin:6px 0 14px;font-weight:600' },
        h('input', { type:'checkbox', checked:f.visible, onchange: e => { f.visible = e.target.checked; } }), 'Show this book on the store'),
      h('div', { class:'acts' }, saveBtn, h('button', { class:'btn btn-soft', onclick: closeEditor }, 'Cancel'),
        isNew ? null : h('button', { class:'btn btn-ghost', style:'border-color:var(--red);color:var(--red);margin-left:auto', onclick: async e => {
          if(!confirm('Delete “' + b.title + '” for good? Past orders keep their record. To only hide it, untick “Show this book on the store” instead.')) return;
          e.target.disabled = true;
          try{ await api('/admin/api/books/' + encodeURIComponent(b.id), { method:'DELETE' }); await loadBooks(); closeEditor(); renderMain(); } catch(err){ msg.textContent = err.message; e.target.disabled = false; }
        } }, 'Delete')),
      msg);
    ed.classList.remove('hidden'); $('shade').classList.remove('hidden'); ed.scrollTop = 0;
  }

  /* ---------------- content: page texts + delivery ---------------- */
  let settings = null;      // { texts, delivery }
  async function loadSettings(){ settings = await api('/admin/api/settings'); }
  function tfield(label, obj, key, o = {}){
    const input = o.multi ? h('textarea', { style:'min-height:' + (o.rows || 90) + 'px', oninput: e => { obj[key] = e.target.value; } }, obj[key] || '')
                          : h('input', { type:'text', value: obj[key] || '', oninput: e => { obj[key] = e.target.value; } });
    return h('label', { class:'fld' }, h('span', {}, label), input);
  }
  function listBlock(title, arr, makeItem, blank, hint){
    const move = (i, d) => { const j = i + d; if(j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; renderMain(); };
    return h('div', { class:'sect' }, h('h3', {}, title), hint ? h('div', { class:'hint' }, hint) : null,
      arr.map((it, i) => h('div', { class:'li' },
        h('div', { class:'tools' }, h('button', { onclick: () => move(i, -1) }, '↑'), h('button', { onclick: () => move(i, 1) }, '↓'),
          h('button', { style:'color:var(--red)', onclick: () => { if(confirm('Remove this item?')){ arr.splice(i, 1); renderMain(); } } }, 'Remove')),
        makeItem(it, i))),
      h('button', { class:'btn btn-soft', onclick: () => { arr.push(blank()); renderMain(); } }, '+ Add'));
  }
  function saveBar(label, fn){
    const msg = h('span', {});
    return h('div', { class:'savebar' }, h('button', { class:'btn btn-primary', onclick: async e => {
      e.target.disabled = true; msg.className = ''; msg.textContent = 'Saving…';
      try{ await fn(); msg.className = 'ok'; msg.textContent = 'Saved ✓ — live on the store'; } catch(err){ msg.className = 'bad'; msg.textContent = err.message; }
      e.target.disabled = false;
    } }, label), msg);
  }

  function renderTextsView(root){
    if(settings == null){
      root.append(h('div', { class:'empty' }, 'Loading…'));
      loadSettings().then(() => { if(view === 'texts' || view === 'delivery') renderMain(); }).catch(e => { $('main').replaceChildren(h('div', { class:'empty' }, e.message)); });
      return;
    }
    const t = settings.texts;
    if(!t){ root.append(h('div', { class:'empty' }, 'The starter page texts were not loaded. Upload seed.json next to server.js on Railway and redeploy, then reopen this tab.')); return; }
    ['introParas','guaranteeBullets','messages','testimonials','faqs'].forEach(k => { if(!Array.isArray(t[k])) t[k] = []; });
    const sect = (title, ...kids) => h('div', { class:'sect' }, h('h3', {}, title), kids);
    root.append(
      h('p', { class:'upd', style:'margin:0 0 12px' }, 'Edit the words on the store. Press “Save page texts” at the bottom when you are done. An empty box shows nothing on the store, so keep boxes filled.'),
      sect('Top of the page', tfield('Small tag line', t, 'heroTag'), tfield('Main headline', t, 'heroTitle'), tfield('Intro text', t, 'heroText', { multi:true })),
      sect('Books section', tfield('Sub-heading under “Available Now”', t, 'shelfSub')),
      sect('Hordhac', tfield('Sub-heading', t, 'introSub')),
      listBlock('Hordhac paragraphs', t.introParas, (it, i) => h('textarea', { style:'width:100%;min-height:90px;padding:9px;border:1.5px solid var(--line);border-radius:8px', oninput: e => { t.introParas[i] = e.target.value; } }, it), () => ''),
      sect('Testimonials heading', tfield('Sub-heading', t, 'testiSub')),
      listBlock('Testimonials', t.testimonials, (it) => h('div', {}, tfield('What they said', it, 'text', { multi:true }), tfield('Name and place (e.g. Ali Osman, Hargaysa)', it, 'name')), () => ({ text:'', name:'' })),
      sect('Big quote', tfield('Quote', t, 'pqText', { multi:true }), tfield('Who said it', t, 'pqAuthor')),
      listBlock('Customer messages (the sliding cards)', t.messages, (it, i) => h('textarea', { style:'width:100%;min-height:60px;padding:9px;border:1.5px solid var(--line);border-radius:8px', oninput: e => { t.messages[i] = e.target.value; } }, it), () => ''),
      sect('Guarantee / Dammaanad', tfield('Headline', t, 'guaranteeHeadline', { multi:true, rows:60 }), tfield('WhatsApp button text', t, 'guaranteeButton')),
      listBlock('Guarantee bullet points', t.guaranteeBullets, (it, i) => h('textarea', { style:'width:100%;min-height:70px;padding:9px;border:1.5px solid var(--line);border-radius:8px', oninput: e => { t.guaranteeBullets[i] = e.target.value; } }, it), () => ''),
      sect('FAQ heading', tfield('Sub-heading', t, 'faqSub')),
      listBlock('FAQ questions', t.faqs, (it) => h('div', {}, tfield('Question', it, 'q'), tfield('Answer (blank line = new paragraph)', it, 'a', { multi:true, rows:120 })), () => ({ q:'', a:'' })),
      sect('Bottom call-to-action', tfield('Small line above', t, 'ctaEyebrow'), tfield('Heading', t, 'ctaHeading'), tfield('Text', t, 'ctaSub', { multi:true, rows:70 }), tfield('Button text', t, 'ctaButton')),
      sect('WhatsApp contact', tfield('WhatsApp number (digits only, with country code, e.g. 252613687974)', t, 'whatsapp'), tfield('How the number is shown to customers', t, 'whatsappDisplay')),
      saveBar('Save page texts', async () => { await api('/admin/api/settings', { method:'PUT', body: JSON.stringify({ texts:t }) }); await loadSettings(); })
    );
  }

  const REGION_LIST = [['benadir','Benadir / Mogadishu'],['somaliland','Somaliland'],['puntland','Puntland'],['southwest','Southwest'],['galmudug','Galmudug'],['hirshabelle','Hirshabelle'],['northeastern','Northeastern'],['jubbaland','Jubbaland']];
  function renderDeliveryView(root){
    if(settings == null){ renderTextsView(root); return; }
    const d = settings.delivery;
    if(!Array.isArray(d.localRegions)) d.localRegions = [];
    const num = (label, key) => h('label', { class:'fld' }, h('span', {}, label), h('input', { type:'number', step:'0.01', min:'0', value:String(d[key]), oninput: e => { d[key] = e.target.value; } }));
    root.append(
      h('p', { class:'upd', style:'margin:0 0 12px' }, 'These fees are used both on the store and when customers are charged, so they always match. Amounts are in US dollars.'),
      h('div', { class:'sect' }, h('h3', {}, 'Where do you keep stock?'),
        h('div', { class:'hint' }, 'Customers who choose one of these regions get the fast, cheaper delivery below. Every other region uses the “All other regions” fees.'),
        h('div', { style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px' }, REGION_LIST.map(([id, label]) =>
          h('label', { style:'display:flex;gap:8px;align-items:center;font-weight:600' },
            h('input', { type:'checkbox', checked:d.localRegions.includes(id), onchange: e => { d.localRegions = e.target.checked ? [...new Set([...d.localRegions, id])] : d.localRegions.filter(x => x !== id); } }), label)))),
      h('div', { class:'sect' }, h('h3', {}, 'Delivery from your stock locations'), h('div', { class:'fgrid' }, num('1 book', 'benadir1'), num('2 or more books', 'benadir2')),
        h('label', { class:'fld' }, h('span', {}, 'Delivery time shown'), h('input', { type:'text', value:d.timeMog, oninput: e => { d.timeMog = e.target.value; } }))),
      h('div', { class:'sect' }, h('h3', {}, 'All other regions'), h('div', { class:'fgrid' }, num('1 book', 'other1'), num('2 books', 'other2')), h('div', { class:'fgrid' }, num('3 or more books', 'other3'), h('span', {})),
        h('label', { class:'fld' }, h('span', {}, 'Delivery time shown'), h('input', { type:'text', value:d.timeOther, oninput: e => { d.timeOther = e.target.value; } }))),
      saveBar('Save delivery fees', async () => { await api('/admin/api/settings', { method:'PUT', body: JSON.stringify({ delivery:d }) }); await loadSettings(); })
    );
  }

  /* ---------------- main ---------------- */
  const NAV = [['orders','Orders'], ['customers','Customers'], ['reports','Reports'], ['books','Books'], ['texts','Page texts'], ['delivery','Delivery fees']];
  function renderNav(){
    $('nav').replaceChildren(...NAV.map(([id, label]) => h('button', { class: view === id ? 'on' : '', onclick: () => { view = id; closeDrawer(); closeEditor(); if(id === 'books') books = null; if(id === 'texts' || id === 'delivery') settings = null; renderNav(); renderMain(); } }, label)));
  }
  function renderStats(){
    const paid = orders.filter(isPaid);
    const cust = buildCustomers();
    $('stats').replaceChildren(
      h('div', { class:'stat' }, h('b', {}, String(orders.filter(isToDeliver).length)), h('span', {}, 'orders to deliver')),
      h('div', { class:'stat' }, h('b', {}, deliveredShown == null ? String(paid.filter(o => o.deliveryStatus === 'delivered').reduce((s, o) => s + o.books, 0)) : deliveredShown + '+'), h('span', {}, 'books delivered (shown on store)')),
      h('div', { class:'stat' }, h('b', {}, money(paid.reduce((s, o) => s + o.total, 0))), h('span', {}, 'paid in total')),
      h('div', { class:'stat' }, h('b', {}, String(orders.filter(o => !isPaid(o)).length)), h('span', {}, 'unpaid / unclear')),
      h('div', { class:'stat' }, h('b', {}, String(cust.filter(c => c.paidOrders >= 1).length)), h('span', {}, 'paying customers')),
      h('div', { class:'stat' }, h('b', {}, String(cust.filter(c => c.paidOrders >= 2).length)), h('span', {}, 'repeat customers'))
    );
  }
  function renderMain(){
    const keepScroll = document.querySelector('.gridwrap');
    const st = keepScroll ? [keepScroll.scrollTop, keepScroll.scrollLeft] : null;
    const root = $('main'); root.replaceChildren();
    if(view === 'orders') renderOrders(root);
    else if(view === 'customers') renderCustomers(root);
    else if(view === 'reports') renderReports(root);
    else if(view === 'books') renderBooksView(root);
    else if(view === 'texts') renderTextsView(root);
    else renderDeliveryView(root);
    const gw = document.querySelector('.gridwrap');
    if(st && gw){ gw.scrollTop = st[0]; gw.scrollLeft = st[1]; }
  }

  async function load(quiet){
    try{
      const [all, sum] = await Promise.all([
        api('/admin/api/orders-all'),
        api('/admin/api/orders?filter=delivered').catch(() => null)
      ]);
      orders = all.orders || [];
      if(sum && sum.summary) deliveredShown = sum.summary.deliveredShown;
      $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', { timeZone:TZ, hour:'2-digit', minute:'2-digit' });
      renderStats();
      if(['orders','customers','reports'].includes(view)) renderMain();
      if(openId || openCustomer) renderDrawer();
    } catch(e){
      if(token) $('main').replaceChildren(h('div', { class:'empty' }, e.message));
    }
  }
  function start(){
    show('app'); renderNav(); if(!F.q) applyPreset(F.preset || 'todo'); load();
    clearInterval(timer); timer = setInterval(() => { if(!document.hidden && !document.activeElement.matches('textarea,input[type=search]')) load(true); }, 60000);
  }
  if(token) start(); else show('login');
</script>
</body>
</html>
